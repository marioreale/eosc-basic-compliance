name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --locked installs exactly what uv.lock pins and fails if the lockfile
      # has drifted from pyproject.toml. Plain `uv sync` would silently
      # re-resolve instead, so a dependency change could land with a green tick
      # and nobody would know CI had tested a different set of versions than
      # the one committed.
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q --junitxml=results/junit.xml
      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/junit.xml
