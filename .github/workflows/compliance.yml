name: compliance run

# Checks the real Node Landing Pages against the default checklist revision
# (DEFAULT_CHECKLIST in src/basic_check/cli.py) and publishes the
# matrix to the run summary.
#
# Manual trigger only, deliberately. Unlike the `tests` workflow, this one sends
# requests to every configured node's website. It is not on a schedule, because a
# recurring unattended job that visits other people's sites is a different kind
# of decision from a check someone chose to run.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Nodes to check (comma-separated ids, e.g. egi,eudat). Leave empty for every node in nodes.yaml.'
        required: false
        default: ''
        type: string
      depth:
        description: 'Link following: 1 = follow one hop, 0 = landing page only, 2 = one further hop (more requests to other people''s sites)'
        required: false
        default: '1'
        type: choice
        options: ['1', '0', '2']
      delay:
        description: 'Seconds to wait between nodes'
        required: false
        default: '2.0'
        type: string

permissions:
  contents: read

# Never let two compliance runs hit the nodes at the same time.
concurrency:
  group: compliance-run
  cancel-in-progress: false

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Pinned versions matter more here than in `tests`: this workflow's output
      # is a set of verdicts about named organisations, and a silently
      # re-resolved playwright, selectolax or lingua can change what the page
      # looks like to the tool. --locked fails the run instead of resolving.
      - run: uv sync --locked

      # Run the unit tests before touching anyone's website. If the rules are
      # broken, making 30-odd requests to real sites to produce wrong verdicts
      # helps no one.
      - name: Test the checker before using it
        run: uv run pytest -q

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      # Inputs are passed through the environment rather than interpolated into
      # the script, so a value containing shell metacharacters cannot execute.
      - name: Check the node landing pages
        id: check
        env:
          ONLY: ${{ inputs.only }}
          DEPTH: ${{ inputs.depth }}
          DELAY: ${{ inputs.delay }}
          RUN_LABEL: web-${{ github.run_number }}
        run: |
          set -euo pipefail
          args=(--depth "$DEPTH" --delay "$DELAY" --run "$RUN_LABEL")
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          echo "Running: basic-check run ${args[*]}"
          uv run basic-check run "${args[@]}"

      # The summary is a counts-and-pointer page, not the matrix. The per-node
      # verdicts are already published in the committed results/results.md, so
      # repeating them here leaks nothing new — but this run is unreviewed, and
      # a world-readable page of FAILs against named organisations,
      # produced automatically and carrying the repository's name, reads as a
      # finding rather than as a draft. The full tables are in the artifact.
      - name: Publish a summary of the run
        if: always()
        env:
          ACTOR: ${{ github.actor }}
          DEPTH: ${{ inputs.depth }}
          ONLY: ${{ inputs.only }}
          RUN_NUMBER: ${{ github.run_number }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Compliance run ${RUN_NUMBER}"
            echo
            echo "Triggered by @${ACTOR} · depth ${DEPTH} · nodes: ${ONLY:-all}"
            echo
            echo "> **Unreviewed automated output.** These counts come from a run nobody has"
            echo "> read yet. Most points are deliberately undecidable by this tool and come"
            echo "> back as review. Nothing here is a compliance statement about any"
            echo "> organisation. The reviewed report is the committed results/results.md."
            echo
            # results/results.json is COMMITTED, so it exists in a fresh
            # checkout whether or not this run produced anything. Summarising it
            # after a failed or skipped check step would publish the last
            # reviewed run's counts under this run's number — the most
            # misleading thing this workflow could do. So the file is only read
            # when the step that rewrites it actually succeeded.
            if [ "${CHECK_OUTCOME}" != "success" ]; then
              echo "The check step did not complete (outcome: ${CHECK_OUTCOME:-skipped}), so"
              echo "this run produced no results. The counts are deliberately not shown:"
              echo "results/results.json in the checkout belongs to an earlier, reviewed run."
            elif [ -f results/results.json ]; then
              python3 - <<'PY'
          import collections, json, pathlib
          run = json.loads(pathlib.Path("results/results.json").read_text())
          tally = collections.Counter(
              r["verdict"] for n in run["nodes"] for r in n["results"]
          )
          print(f"{len(run['nodes'])} node(s) assessed against "
                f"{len(run['checklist']['points'])} checklist point(s).")
          print()
          print("| Verdict | Count |")
          print("|---|---|")
          for verdict in ("PASS", "FAIL", "MANUAL_REVIEW", "ERROR"):
              if tally.get(verdict):
                  print(f"| {verdict} | {tally[verdict]} |")
          print()
          missing = run.get("missing_evidence") or []
          if missing:
              print(f"**Incomplete:** no evidence for {', '.join(missing)}.")
              print()
          print("Per-node verdicts and evidence are in the **compliance-results** "
                "artifact attached to this run.")
          PY
            else
              echo "No results were produced — see the log of the previous step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-results
          path: |
            results/
            !results/evidence/*.png
          if-no-files-found: warn
