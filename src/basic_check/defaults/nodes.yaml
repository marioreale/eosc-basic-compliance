# The Node Landing Pages under assessment.
#
# `url` must be the URL registered in the EOSC EU Node Contributors Dashboard
# ("Website address", section 1.2 field 6), because that registered URL is what
# the checklist defines as the Node Landing Page. The URLs below were supplied
# for assessment; where one differs from the registered value, the registered
# value wins and should be corrected here.
#
# To add a node, see "Adding a node" in docs/GUIDE.md: an entry here is one of
# three files that must change together, and tests/test_nodes.py will fail
# until they agree.
#
# `eosc_page` is the node's dedicated entry on eosc.eu, which checklist point 4
# requires the landing page to link to. These slugs were read from the live
# index at eosc.eu/building-the-eosc-federation/, so a point 4 failure can name
# the exact URL that is missing instead of just reporting an absence.
nodes:
  - id: bbmri-eric
    name: BBMRI-ERIC
    # Set back on 26 September 2026 to this address, the one the published
    # results/ run of 24 September was collected from. From 25 to 26 September
    # it was https://dev3.bbmri-eric.eu/eosc-node-bbmri-eric/, a host whose
    # robots.txt disallows every path.
    url: https://www.bbmri-eric.eu/eosc-node-bbmri-eric/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-bbmri-eric/
  - id: cern
    name: CERN
    # Supplied for assessment as the CERN Node Landing Page. Note that this is
    # an INDIGO IAM sign-in endpoint ("INDIGO IAM for CERN-EOSC-NODE"), not a
    # descriptive landing page: it served 164 characters of visible text on
    # 21 September 2026. Several checklist points ask what the page states, so
    # expect review outcomes that reflect the page, not the node. eosc.eu lists
    # no separate node website for CERN.
    url: https://eosc-auth.cern.ch/login
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-cern/
  - id: eosc-cz
    name: EOSC Node Czechia
    url: https://www.eosc.cz/en/about-eosc-cz/eosc-node-czechia
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-czechia/
  - id: eosc-dto
    name: EOSC DTO (D4Science)
    url: https://eosc-dto.d4science.org/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-digital-twin-of-the-ocean/
  - id: data-terra
    name: Data Terra
    url: https://www.data-terra.org/eosc/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-data-terra/
  - id: eosc-fi
    name: EOSC Finland
    url: https://eosc.fi/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-finland/
  - id: panosc
    name: PaNOSC
    url: https://eosc.panosc.eu/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-panosc/
  - id: eudat
    name: EUDAT
    url: https://portal.eudat.eu/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-eudat/
  - id: egi
    name: EGI
    url: https://www.egi.eu/egi-node
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-egi/
  - id: geant
    name: GÉANT
    url: https://geant.org/geant-eosc-node/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-geant/
  - id: ebrains
    name: EBRAINS
    url: https://ebrains.eu/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-ebrains-ri/
  - id: eosc-it
    name: EOSC Node Italy
    # Changed on 26 September 2026 from https://eosc.it/, supplied on 24
    # September. On that date eosc.it had nameservers (GARR, CNR-ISTI) but no A
    # or AAAA record, and www.eosc.it did not exist, so the page could not be
    # fetched and the published results/ run skipped Italy. eosc.eu lists no
    # separate node website for Italy (the node is operated by ICSC).
    url: https://eoscnode-it.d4science.org/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-italy/
  - id: eosc-sk
    name: EOSC Node Slovakia
    url: https://eosc.sk/
    eosc_page: https://eosc.eu/building-the-eosc-federation/eosc-node-slovakia/
