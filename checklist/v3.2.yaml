# Node Landing Page Verification Checklist v3.2 (28 September 2026)
# transcribed as data, one entry per checklist point.
#
# The wording in `requirement` is quoted from the checklist so that a reader can
# audit the rule against the source document without a diff. `decidable` records
# whether a script can settle the point by inspection alone; where it cannot, the
# tool gathers evidence and returns MANUAL_REVIEW rather than inventing a verdict.
#
# This distinction is the whole point of the design. A checker that returns
# PASS/FAIL on every line looks more useful and is worth less: a confident wrong
# answer about a node costs more to undo than an honest "a human must look".

checklist_version: "3.2"
checklist_date: "2026-09-28"

# Provenance. `source_document` names the authoritative file as circulated;
# `source_file` is the copy committed beside this YAML, and `source_sha256` is
# its hash, asserted by tests/test_checklist.py. The committed file is a PDF
# rendering of the .docx named in `source_document`, not that .docx itself: the
# hash pins the exact bytes this transcription was made from, and is not a
# signature over the authoritative original.
source_document: 20260928_Node_Landing_Page_Verification_Checklist_v3.2.docx
source_file: 20260928_Node_Landing_Page_Verification_Checklist_v3.2.pdf
source_sha256: e7f3fdfff0d9e1be4aa1466591c6ca65695f1e471707ad226ff137f8da6f6a42

# The item 5 rule this revision applies. Read by the CLI and passed to
# checks.run_all: true means the information of item 5 must be on the NLP *and*
# in the Catalogue. v3.0.yaml and v3.1.yaml do not carry the key, which the CLI
# reads as false (on the NLP *or* in the Catalogue), so runs made under them are
# rebuilt with their own rule.
item5_on_nlp: true

# What changed from v3.1 (24 September 2026), read point by point against the
# document. Only item 5 changed; points 1, 1R, 2, 3, 4, 6 and 7 are word for
# word the same, and their rules are unchanged.
#
# - 5a/5b/5c: "accessible in English either directly or via the link to the
#   resource's entry in the EOSC Catalogue" becomes "both directly on the NLP
#   presenting the resource to the users and via the link to the resource's
#   entry in the EOSC Catalogue". The document adds that this means the purpose,
#   AUP and UAP must be in the resource's metadata in the Service or Research
#   Products metadata catalogues, and that "a), b) and c) must be present, for
#   each resource in the EOSC Exchange, both on the NLP itself and in the
#   Metadata about the Resource in the Node Catalogue".
#   Consequence for 5b and 5c: a landing page with no pointer to the policy used
#   to be MANUAL_REVIEW (it might be in the Catalogue); it is now FAIL, unless
#   one of the exceptions below applies. 5a stays MANUAL_REVIEW: whether a
#   description states a purpose is reading, and the resources cannot be listed
#   from the page. The Catalogue half is not read by this tool for any of the
#   three, so a PASS on 5b or 5c covers the NLP half only and says so.
# - New notes in item 5, each applied by the 5b/5c rule:
#   * "AUP/UAP can be provided via specific product licenses in the case of
#     datasets, archives, software, i.e. non-Services resources": a licence link
#     turns a missing policy into MANUAL_REVIEW, not PASS.
#   * "AUP and UAP can be provided through the same, single document": a link to
#     the other policy turns a missing one into MANUAL_REVIEW, not PASS.
#   * "AUP and UAP do not necessarily need to be unique per service": one
#     policy linked from the NLP can serve every resource, so a single pointer
#     is enough for the NLP half.

# Each point declares, in `implemented_by`, the function in basic_check.checks
# that decides it. tests/test_checklist.py asserts the mapping is total in both
# directions: every point resolves to a real callable, and every check function
# is claimed by exactly one point. Without this the YAML and the rules could
# disagree in silence -- a reworded requirement paired with unchanged logic would
# still produce reports quoting the new wording while applying the old rule.
points:
  - id: "1"
    title: NLP is publicly accessible, or reachable via EOSC AAI login
    requirement: >-
      The NLP [...] must be either publicly accessible without login, or
      accessible via login through the EOSC AAI. "Accessible via login through
      the EOSC AAI" means the page presents a login button or link pointing to
      the Node's EOSC AAI-compliant access mechanism, integrated and verified
      under requirement [P.2] of the Production 1.0 Checklist for EOSC Nodes,
      v1.4.
    implemented_by: check_1
    decidable: true
    decidable_note: >-
      Anonymous reachability is directly observable: fetch the URL without
      credentials and see whether the content is served. Branch (b) only matters
      when (a) fails.

  - id: "1R"
    title: Node Exchange resources linked from the NLP are public or behind EOSC AAI
    requirement: >-
      [The NLP, and] every Node Exchange resource it links to, directly or via
      intermediate pages, must be either publicly accessible without login, or
      accessible via login through the EOSC AAI.
    implemented_by: check_1R
    decidable: false
    decidable_note: >-
      Not decidable by inspection, and one level of link following does not close
      the gap. The requirement quantifies over every resource reachable from the
      page "directly or via intermediate pages", which is unbounded; this tool follows at most one level, and only links that can
      settle a specific point. Even with full traversal it would still require
      confirming that each login encountered is genuinely EOSC AAI rather than a
      local or institutional IdP, and whether a given login is EOSC AAI compliant
      is settled under requirement [P.2] of the Production 1.0 Checklist, not by
      reading HTML. Nor can a script tell which linked resources are Node
      Exchange resources. The tool
      reports how many followed pages were served anonymously and lists the
      outbound resource links it found, so a reviewer has a work list.

  - id: "2"
    title: Scope, intended users and responsible organisation are stated
    requirement: >-
      Clearly state the Node's scope, intended users and responsible organisation.
      (It is up to the Node to feature all the organisations involved).
    implemented_by: check_2
    decidable: false
    decidable_note: >-
      "Clearly state" is a judgement about whether prose communicates three
      things to a researcher. A keyword match would produce confident nonsense in
      both directions. The tool extracts the candidate passages and names the
      reviewer must read.

  - id: "3"
    title: EOSC logo and official Tripartite-approved node name are visible
    requirement: >-
      Clearly and visibly show the EOSC logo and the official Tripartite-approved
      name of the Node.
    implemented_by: check_3
    decidable: partial
    decidable_note: >-
      Presence of an EOSC logo image is checkable, with caveats: a logo rendered
      as a CSS background or inlined SVG sprite can be missed, and "clearly and
      visibly" is a judgement. The Tripartite-approved name is NOT checkable
      without the authoritative list of approved node names, which the tool does
      not have; supply it via --approved-names to turn this into a real check.

  - id: "4"
    title: Link to the node's own dedicated page on eosc.eu
    requirement: >-
      Include a link to the Node's own dedicated page on the eosc.eu website —
      the Node's entry under eosc.eu/building-the-eosc-federation, not the
      eosc.eu homepage or the index page itself.
    implemented_by: check_4
    decidable: true
    decidable_note: >-
      Fully decidable and the sharpest point in the checklist: an href under
      eosc.eu/building-the-eosc-federation/ with a path segment beyond the index.
      The checklist explicitly excludes both the homepage and the index, so those
      are matched and rejected rather than ignored.

  - id: "5a"
    title: Purpose description in English, on the NLP and in the Catalogue, for each Node Exchange resource
    requirement: >-
      For all Node Exchange research resources offered by the Node to EOSC users,
      a purpose description must be accessible in English both directly on the
      NLP presenting the resource to the users and via the link to the
      resource's entry in the EOSC Catalogue [...], i.e. in the Metadata about
      the Resource in the Service or Research Products Metadata catalogues.
    implemented_by: check_5a
    decidable: false
    decidable_note: >-
      Requires enumerating "all Node Exchange research resources offered by the
      Node", which is not derivable from the landing page alone, and reading each
      description; the Catalogue metadata half is not read by this tool at all.
      The tool reports the page's size and link count so a reviewer has a
      starting point.

  - id: "5b"
    title: Acceptable Use Policy (AUP) linked from the NLP, and in the Catalogue, for each Node Exchange resource
    requirement: >-
      For all Node Exchange research resources offered by the Node to EOSC
      users, the Acceptable Use Policy (AUP) must be accessible in English both
      directly on the NLP presenting the resource to the users and via the link
      to the resource's entry in the EOSC Catalogue [...]. AUP/UAP can be
      provided via specific product licenses in the case of datasets, archives,
      software, i.e. non-Services resources. AUP and UAP can be provided through
      the same, single document. AUP and UAP do not necessarily need to be
      unique per service.
    implemented_by: check_5b
    decidable: partial
    decidable_note: >-
      The NLP half is checkable: a pointer to an AUP on the landing page, and,
      one level down, whether the target is served and reads like a policy.
      Since v3.2 its absence is a FAIL, because being in the Catalogue alone no
      longer suffices -- except when the page links to a User Access Policy
      (possibly one document for both) or to a licence (allowed for non-service
      resources), when the page mentions the AUP without a link, or when the DOM
      did not arrive; those are MANUAL_REVIEW. A PASS covers the NLP half only:
      that the policy covers every resource presented, and that it is also in
      each resource's Catalogue metadata, remain a reviewer's check.

  - id: "5c"
    title: User Access Policy (UAP) linked from the NLP, and in the Catalogue, for each Node Exchange resource
    requirement: >-
      For all Node Exchange research resources offered by the Node to EOSC
      users, the User Access Policy (UAP) must be accessible in English both
      directly on the NLP presenting the resource to the users and via the link
      to the resource's entry in the EOSC Catalogue [...]. AUP/UAP can be
      provided via specific product licenses in the case of datasets, archives,
      software, i.e. non-Services resources. AUP and UAP can be provided through
      the same, single document. AUP and UAP do not necessarily need to be
      unique per service.
    implemented_by: check_5c
    decidable: partial
    decidable_note: >-
      Same rule as 5b, with the roles swapped: a link to an Acceptable Use
      Policy turns a missing UAP into MANUAL_REVIEW, because the checklist allows
      one document for both. The two are still recognised separately -- an
      "Access Policy" is matched for 5c, an "Acceptable Use Policy" or "Terms of
      use" for 5b -- so a page that links only one of them gets a PASS on that
      point and a review on the other, not two PASSes.

  - id: "6"
    title: Means of contacting the node helpdesk
    requirement: Provide means of contacting the Node helpdesk.
    implemented_by: check_6
    decidable: partial
    decidable_note: >-
      A contact route (mailto:, contact/support/helpdesk page, contact form) is
      checkable. Whether it reaches a *helpdesk* rather than a generic press or
      info address is a judgement, so a generic-looking contact is flagged rather
      than passed silently.

  - id: "7"
    title: The NLP itself is in English
    requirement: >-
      The NLP itself is in English. Other pages need not be, except for the
      information required by item 5.
    implemented_by: check_7
    decidable: true
    decidable_note: >-
      Statistical language detection over the page's main text, cross-checked
      against the declared lang attribute. Both are reported, because a mismatch
      between what a page declares and what it actually contains is itself worth
      seeing. The exception for item 5 information is assessed under 5a-5c,
      whose requirements already demand English.
